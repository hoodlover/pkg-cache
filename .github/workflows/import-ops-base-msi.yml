name: Import OPS-BASE MSI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-msi:
    runs-on: windows-latest
    steps:
      - name: Check out pkg-cache
        uses: actions/checkout@v4

      - name: Download verified OPS-BASE build
        uses: actions/download-artifact@v4
        with:
          name: OPS-BASE-import-msi
          path: incoming
          github-token: ${{ secrets.OPS_BASE_TRANSFER_TOKEN }}
          repository: hoodlover/OPS-BASE
          run-id: 30963636115

      - name: Replace MSI used by the BAT installer
        shell: pwsh
        run: |
          $source = Get-ChildItem incoming -Recurse -Filter "OPS-BASE-import_26.102.171_x64.msi" | Select-Object -First 1
          if (-not $source) {
            Write-Error "Expected MSI was not found in the downloaded artifact."
            exit 1
          }
          Copy-Item -LiteralPath $source.FullName -Destination "Hapag-IDT-OPS-Base.msi" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "Hapag-IDT-OPS-Base.msi").Hash
          Write-Host "MSI SHA256: $hash"

      - name: Commit MSI to pkg-cache
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Hapag-IDT-OPS-Base.msi
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "MSI already matches the requested build."
            exit 0
          }
          git commit -m "Update OPS-BASE MSI to wahoo 26.102.171"
          git push
