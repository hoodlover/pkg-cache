name: Cloud transfer OPS-BASE MSI
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transfer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OPS-BASE-full-msi
          path: incoming
          github-token: ${{ secrets.OPS_BASE_TRANSFER_TOKEN }}
          repository: hoodlover/OPS-BASE
          run-id: '31022041092'
      - name: Publish verified installer
        shell: pwsh
        run: |
          $msi = Get-ChildItem incoming -Recurse -Filter 'OPS-BASE-full_26.102.176_x64.msi' | Select-Object -First 1
          if (-not $msi) { throw 'Signed 26.102.176 MSI not found' }
          Copy-Item $msi.FullName 'Hapag-IDT-OPS-Base.msi' -Force
          if ((Get-AuthenticodeSignature 'Hapag-IDT-OPS-Base.msi').Status -ne 'Valid') { throw 'MSI signature invalid' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Hapag-IDT-OPS-Base.msi
          git commit -m 'Publish signed OPS-BASE 26.102.176'
          git push