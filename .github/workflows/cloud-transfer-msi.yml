name: Cloud transfer OPS-BASE MSI
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transfer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download signed MSI artifact in GitHub cloud
        uses: actions/download-artifact@v4
        with:
          name: OPS-BASE-full-msi
          path: incoming
          github-token: ${{ secrets.OPS_BASE_TRANSFER_TOKEN }}
          repository: hoodlover/OPS-BASE
          run-id: '31014672723'
      - name: Publish stable installer filename
        shell: pwsh
        run: |
          $msi = Get-ChildItem incoming -Recurse -Filter 'OPS-BASE-full_26.102.174_x64.msi' | Select-Object -First 1
          if (-not $msi) { throw 'Signed 26.102.174 MSI not found in artifact' }
          Copy-Item $msi.FullName 'Hapag-IDT-OPS-Base.msi' -Force
          $sig = Get-AuthenticodeSignature 'Hapag-IDT-OPS-Base.msi'
          if ($sig.Status -ne 'Valid') { throw "MSI signature is $($sig.Status)" }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Hapag-IDT-OPS-Base.msi
          git commit -m 'Publish signed OPS-BASE 26.102.174'
          git push